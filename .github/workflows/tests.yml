name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.9'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s plugins/gemini-delegate/tests -v
      - run: python -m unittest discover -s tests -v
      - name: Repeat Windows live-record race regression
        if: runner.os == 'Windows'
        run: >-
          python -c "import sys,unittest; sys.path.insert(0,'plugins/gemini-delegate/tests');
          from test_worker import WorkflowTests;
          result=unittest.TextTestRunner().run(unittest.TestSuite(
          [WorkflowTests('test_live_task_records_are_project_scoped_and_keep_preview') for _ in range(60)] +
          [WorkflowTests('test_live_task_visible_to_another_manager_during_updates') for _ in range(20)]));
          sys.exit(not result.wasSuccessful())"
