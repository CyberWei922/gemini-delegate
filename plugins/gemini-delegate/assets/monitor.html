<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini 子任务</title>
<style>
:root{color-scheme:light dark;--bg:#f7f8fa;--card:#fff;--ink:#202731;--muted:#6a7481;--line:#e4e8ee;--accent:#4268dc;--green:#12805c;--red:#c34446}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:880px;margin:auto;padding:26px 20px}header{display:flex;gap:12px;align-items:center;margin-bottom:16px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:white;font-size:23px}h1{font-size:20px;margin:0}p{margin:2px 0;color:var(--muted)}.live{margin-left:auto;color:var(--green);font-size:12px}.toolbar{display:flex;gap:10px;margin:18px 0}select{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px;border-radius:8px;max-width:70%}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}.metric b{display:block;font-size:22px}.metric span{font-size:12px;color:var(--muted)}.notice{margin:16px 0;font-size:12px;color:var(--muted)}.task{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}.task.active{border-left:3px solid var(--accent)}.top{display:flex;align-items:center;gap:10px}.avatar{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:#edf0ff;color:var(--accent);display:grid;place-items:center;font-weight:600}.title{font-size:14px;font-weight:600;flex:1;overflow-wrap:anywhere}.badge{font-size:11px;border-radius:20px;padding:3px 9px;background:#edf0ff;color:var(--accent);white-space:nowrap}.completed .badge{background:#e5f4ed;color:var(--green)}.failed .badge,.interrupted .badge{background:#fbeaec;color:var(--red)}.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:9px 0 0 38px}.error{color:var(--red);font-size:12px;margin:10px 0}details{margin:12px 0 0 38px}summary{font-size:12px;color:var(--accent);cursor:pointer}pre{font:12px/1.65 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);padding:12px;border-radius:8px;max-height:350px;overflow:auto}.empty{padding:40px 20px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.path{font-size:11px;overflow-wrap:anywhere}.spin{animation:pulse 1.6s infinite}@keyframes pulse{50%{opacity:.4}}@media(prefers-color-scheme:dark){:root{--bg:#17191e;--card:#202329;--ink:#eef0f5;--muted:#a0a8b7;--line:#343940;--accent:#9aaeff;--green:#75d6ac;--red:#ff9da3}.logo{background:#607ce4}.avatar,.badge{background:#303951}.completed .badge{background:#253c34}.failed .badge,.interrupted .badge{background:#442e35}}@media(max-width:400px){main{padding:18px 12px}.metric{padding:8px}.metric b{font-size:18px}.top{gap:7px}.meta,details{margin-left:0}}
</style>
<main><header><div class="logo">✦</div><div><h1>Gemini 子任务</h1><p>Gemini 3.8 Flash High · 外部执行助手</p></div><span class="live" id="connection">连接中</span></header>
<div class="toolbar"><select id="project" aria-label="筛选项目"><option value="">全部项目</option></select><select id="scope" aria-label="筛选任务"><option value="all">全部记录</option><option value="today">今天</option><option value="active">运行中</option></select></div>
<div class="metrics"><div class="metric"><b id="total">0</b><span>委派任务</span></div><div class="metric"><b id="active">0</b><span>正在执行</span></div><div class="metric"><b id="done">0</b><span>已完成</span></div><div class="metric"><b id="tokens">—</b><span>已报告 tokens</span></div></div>
<div class="notice">每 2 秒刷新 · 任务只有进入本插件才会出现；没有记录表示尚未通过本插件委派。排队与读取资料阶段不代表 Gemini 已开始回答。</div><section id="tasks" aria-live="polite"></section><p class="notice">这里显示实际 AGY 调用记录。它是本地任务看板；GPT 仍负责规划、复核与最终交付。</p></main>
<script>
const labels={queued:'排队中',retrieving:'读取资料',waiting_for_agy:'等待 AGY',running:'Gemini 执行中',retrying:'重试中',completed:'已完成',failed:'失败',cancelled:'已取消',interrupted:'执行进程已退出'};
const terminal=new Set(['completed','failed','cancelled','interrupted']);let tasks=[],now=Date.now()/1000;const expanded=new Set();
const $=id=>document.getElementById(id);function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}function seconds(t){return Math.round(t.elapsed_seconds??Math.max(0,now-(t.started_at??t.created_at)))}function duration(n){return n<60?n+' 秒':Math.floor(n/60)+' 分 '+n%60+' 秒'}
function render(){const project=$('project').value,scope=$('scope').value;const visible=tasks.filter(t=>(!project||t.workspace===project)&&(scope!=='active'||!terminal.has(t.status))&&(scope!=='today'||new Date(t.created_at*1000).toDateString()===new Date().toDateString()));$('total').textContent=visible.length;$('active').textContent=visible.filter(t=>!terminal.has(t.status)).length;$('done').textContent=visible.filter(t=>t.status==='completed').length;const usage=visible.filter(t=>Number.isFinite(t.usage?.total_tokens));$('tokens').textContent=usage.length?usage.reduce((a,t)=>a+t.usage.total_tokens,0).toLocaleString():'—';const fragment=document.createDocumentFragment();for(const t of visible){const card=node('article',undefined,'task '+t.status+(!terminal.has(t.status)?' active':''));const top=node('div',undefined,'top');top.append(node('div','G','avatar'),node('div',t.title,'title'),node('span',labels[t.status]??t.status,'badge'+(!terminal.has(t.status)?' spin':'')));card.append(top);const meta=node('div',undefined,'meta');meta.append(node('span',t.workspace?.split('/').pop()||'未指定项目'),node('span',duration(seconds(t))),node('span',new Date(t.created_at*1000).toLocaleString()));if(t.attempts?.length)meta.append(node('span','尝试 '+t.attempts.length+' 次'));if(t.usage?.total_tokens)meta.append(node('span',t.usage.total_tokens.toLocaleString()+' tokens'));card.append(meta);if(t.status==='queued'||t.status==='retrieving'||t.status==='waiting_for_agy')card.append(node('p','等待调用；尚未开始本次 Gemini 执行','notice'));if(t.error)card.append(node('p',t.error.code+' · '+t.error.message,'error'));const detail=node('details');detail.open=expanded.has(t.id);detail.addEventListener('toggle',()=>detail.open?expanded.add(t.id):expanded.delete(t.id));detail.append(node('summary','任务详情与结果'));detail.append(node('p','任务 '+t.id+' · '+t.model,'path'),node('p',t.workspace,'path'));if(t.applied_at)detail.append(node('p','文件修改已由主智能体复核并应用','notice'));else if(t.changes?.length)detail.append(node('p','有 '+t.changes.length+' 个修改候选，等待主智能体复核','notice'));if(t.result_preview){let text=t.result_preview;try{text=JSON.stringify(JSON.parse(text),null,2)}catch{}detail.append(node('pre',text+(t.result_truncated?'\n（预览已截断）':'')))}else detail.append(node('p',terminal.has(t.status)?'没有可用结果。':'正在等待结果。','notice'));card.append(detail);fragment.append(card)}if(!visible.length)fragment.append(node('div','此筛选范围内还没有 Gemini 委派任务。','empty'));$('tasks').replaceChildren(fragment)}
async function refresh(){try{const token=new URL(location.href).searchParams.get('token');const r=await fetch('/api/tasks?token='+encodeURIComponent(token),{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();tasks=data.tasks;now=data.now;const selected=$('project').value;const projects=[...new Set(tasks.map(t=>t.workspace).filter(Boolean))].sort();$('project').replaceChildren(new Option('全部项目',''),...projects.map(p=>new Option(p.split('/').pop()+' · '+p,p)));if(projects.includes(selected))$('project').value=selected;else if(!selected){const initial=new URL(location.href).searchParams.get('workspace');if(initial&&projects.includes(initial))$('project').value=initial}$('connection').textContent='● 实时连接';render()}catch{$('connection').textContent='连接中断';$('connection').style.color='var(--red)'}}$('project').onchange=render;$('scope').onchange=render;refresh();setInterval(refresh,2000);
</script></html>
